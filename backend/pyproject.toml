[tool.poetry]
name = "cabruca-api"
version = "0.1.0"
description = "API de upload, fila e consulta de resultados de deteccao de doencas/pragas em cacau"
authors = ["Matheus Braga"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }
pydantic-settings = "^2.6"
alembic = "^1.14"
boto3 = "^1.43.52"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.0,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "moto[s3] (>=5.2.2,<6.0.0)"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# B008 (Depends() em default de argumento) é o padrão idiomático do FastAPI,
# não um bug — ignorado globalmente em vez de silenciado rota a rota.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
