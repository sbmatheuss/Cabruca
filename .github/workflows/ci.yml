name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: cabruca
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U user -d cabruca"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://user:password@localhost:5432/cabruca
      AWS_REGION: sa-east-1
      S3_BUCKET_NAME: cabruca-images-dev
      # Dummy: Settings() precisa achar algo no ambiente pra instanciar, mas
      # os testes nunca chamam o Cognito real (get_current_user_id é
      # sobrescrita em tests/conftest.py).
      COGNITO_USER_POOL_ID: sa-east-1_test0000
      COGNITO_APP_CLIENT_ID: test-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Tests (pytest)
        run: poetry run pytest
